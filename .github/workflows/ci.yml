name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - name: Types are up to date
        run: |
          npm run types
          git diff --exit-code -- types
          test -z "$(git status --porcelain -- types)"
      - run: npm test
      - run: npm run build
