<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MotionEngine — Demo</title>
  <script type="importmap">
  { "imports":
    {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js/+esm",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "talkinghead": "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@1.7/modules/talkinghead.mjs"
    }
  }
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #111;
      color: #eee;
      font-family: system-ui, sans-serif;
      display: flex;
      height: 100vh;
    }

    #avatar-container {
      flex: 1;
      position: relative;
      background: #1a1a2e;
    }

    #avatar-container canvas {
      width: 100% !important;
      height: 100% !important;
    }

    #panel {
      width: 380px;
      padding: 20px;
      overflow-y: auto;
      background: #1e1e1e;
      border-left: 1px solid #333;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    h2 {
      font-size: 16px;
      color: #aaa;
      border-bottom: 1px solid #333;
      padding-bottom: 8px;
    }

    .btn {
      padding: 10px 16px;
      border: 1px solid #444;
      border-radius: 6px;
      background: #2a2a2a;
      color: #eee;
      cursor: pointer;
      font-size: 13px;
      transition: all .15s;
    }

    .btn:hover {
      background: #3a3a3a;
      border-color: #666;
    }

    .btn:active {
      background: #444;
    }

    .btn.active {
      background: #1a5a2a;
      border-color: #2a8a4a;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .compare-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .compare-row .btn {
      font-size: 12px;
      padding: 8px 10px;
    }

    .btn.native {
      background: #1a2a3a;
      border-color: #2a4a6a;
    }

    .btn.native:hover {
      background: #2a3a4a;
      border-color: #3a5a7a;
    }

    .btn.custom {
      background: #2a1a3a;
      border-color: #4a2a6a;
    }

    .btn.custom:hover {
      background: #3a2a4a;
      border-color: #5a3a7a;
    }

    .btn.sequence {
      background: #3a2a1a;
      border-color: #6a4a2a;
    }

    .btn.sequence:hover {
      background: #4a3a2a;
      border-color: #7a5a3a;
    }

    .btn.stop-btn {
      background: #4a1a1a;
      border-color: #7a2a2a;
    }

    .btn.stop-btn:hover {
      background: #5a2a2a;
      border-color: #8a3a3a;
    }

    .section-label {
      font-size: 11px;
      color: #666;
      text-align: center;
      padding: 4px 0 2px;
    }

    .compare-header {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 4px;
    }

    .compare-header span {
      font-size: 10px;
      color: #555;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #custom-input {
      display: flex;
      gap: 8px;
    }

    #custom-input input {
      flex: 1;
      padding: 10px;
      border: 1px solid #444;
      border-radius: 6px;
      background: #2a2a2a;
      color: #eee;
      font-size: 13px;
    }

    #custom-input input::placeholder {
      color: #666;
    }

    #log {
      font-family: monospace;
      font-size: 11px;
      background: #0a0a0a;
      border-radius: 6px;
      padding: 12px;
      max-height: 200px;
      overflow-y: auto;
      white-space: pre-wrap;
      line-height: 1.5;
      flex: 1;
      min-height: 100px;
    }

    .log-info {
      color: #6c9;
    }

    .log-warn {
      color: #fc6;
    }

    .log-error {
      color: #f66;
    }

    #status {
      font-size: 12px;
      color: #888;
      padding: 8px;
      background: #0a0a0a;
      border-radius: 6px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div id="avatar-container"></div>
  <div id="panel">
    <h2>MotionEngine Demo</h2>
    <div id="status">Loading avatar...</div>
    <button class="btn stop-btn" id="btn-stop">⏹ Stop</button>

    <h2>Compare: TalkingHead vs MotionEngine</h2>
    <div class="compare-header">
      <span>TalkingHead native</span>
      <span>MotionEngine custom</span>
    </div>

    <div class="section-label">Gestures</div>
    <div class="compare-row">
      <button class="btn native" data-motion="&#x270B;">✋ Wave</button>
      <button class="btn custom" data-motion="wave_right">Wave Hello</button>
    </div>
    <div class="compare-row">
      <button class="btn native" data-motion="&#x1F44D;">👍 Thumbs Up</button>
      <button class="btn custom" data-motion="thumbup_right">Thumbs Up</button>
    </div>
    <div class="compare-row">
      <button class="btn native" data-motion="&#x1F44E;">👎 Thumbs Down</button>
      <button class="btn custom" data-motion="thumbdown_right">Thumbs Down</button>
    </div>
    <div class="compare-row">
      <button class="btn native" data-motion="&#x1F44C;">👌 OK</button>
      <button class="btn custom" data-motion="ok_wink">OK + Wink</button>
    </div>
    <div class="compare-row">
      <button class="btn native" data-motion="&#x1F937;">🤷 Shrug</button>
      <button class="btn custom" data-motion="shrug_confused">Shrug</button>
    </div>
    <div class="compare-row">
      <button class="btn native" data-motion="&#x1F64F;">🙏 Namaste</button>
      <button class="btn custom" data-motion="namaste_bow">Namaste</button>
    </div>

    <div class="section-label">Head / Body</div>
    <div class="compare-row">
      <button class="btn native" data-motion="yes">yes (native)</button>
      <button class="btn custom" data-motion="nod_yes">Nod Yes</button>
    </div>
    <div class="compare-row">
      <button class="btn native" data-motion="no">no (native)</button>
      <button class="btn custom" data-motion="shake_no">Shake No</button>
    </div>
    <div class="compare-row">
      <button class="btn native" data-motion="&#x1F609;">😉 Wink</button>
      <button class="btn custom" data-motion="wink">Wink</button>
    </div>
    <div class="compare-row">
      <button class="btn native" data-motion="&#x1F914;">🤔 Thinking</button>
      <button class="btn custom" data-motion="thinking">Thinking</button>
    </div>

    <div class="section-label">Expressions</div>
    <div class="compare-row">
      <button class="btn native" data-motion="&#x1F621;">😡 Angry</button>
      <button class="btn custom" data-motion="angry">Angry</button>
    </div>
    <div class="compare-row">
      <button class="btn native" data-motion="&#x1F614;">😔 Sad</button>
      <button class="btn custom" data-motion="sad">Sad</button>
    </div>
    <div class="compare-row">
      <button class="btn native" data-motion="&#x1F631;">😱 Surprised</button>
      <button class="btn custom" data-motion="surprised">Surprised</button>
    </div>
    <div class="compare-row">
      <button class="btn native" data-motion="&#x1F60A;">😊 Happy</button>
      <button class="btn custom" data-motion="celebrate">Celebrate</button>
    </div>

    <div class="section-label">MotionEngine only</div>
    <div class="btn-grid">
      <button class="btn custom" data-motion="look_up">Look Up</button>
      <button class="btn custom" data-motion="look_down">Look Down</button>
      <button class="btn custom" data-motion="bow">Bow</button>
      <button class="btn custom" data-motion="turn_around">Turn Around</button>
      <button class="btn custom" data-motion="jump">Jump</button>
      <button class="btn custom" data-motion="point">Point</button>
    </div>

    <div class="section-label">New motions</div>
    <div class="btn-grid">
      <button class="btn custom" data-motion="laugh">Laugh</button>
      <button class="btn custom" data-motion="yawn">Yawn</button>
      <button class="btn custom" data-motion="nervous">Nervous</button>
      <button class="btn custom" data-motion="applause">Applause</button>
      <button class="btn custom" data-motion="dance">Dance</button>
      <button class="btn custom" data-motion="shy">Shy</button>
      <button class="btn custom" data-motion="facepalm">Facepalm</button>
      <button class="btn custom" data-motion="listen">Listen</button>
      <button class="btn custom" data-motion="excited">Excited</button>
      <button class="btn custom" data-motion="dismiss">Dismiss</button>
    </div>

    <div class="section-label">TalkingHead exclusive</div>
    <div class="btn-grid">
      <button class="btn custom" data-motion="tongueout">Tongue Out</button>
      <button class="btn custom" data-motion="kiss">Kiss</button>
      <button class="btn custom" data-motion="eyeroll">Eye Roll</button>
      <button class="btn custom" data-motion="smirk">Smirk</button>
      <button class="btn custom" data-motion="grimace">Grimace</button>
      <button class="btn custom" data-motion="pleading">Pleading</button>
      <button class="btn custom" data-motion="sleeping">Sleeping</button>
      <button class="btn custom" data-motion="sigh">Sigh</button>
    </div>

    <h2>Sequences</h2>
    <div class="btn-grid">
      <button class="btn sequence" data-sequence="wave_right,thumbup_right,bow">Greet &amp; Bow</button>
      <button class="btn sequence" data-sequence="thinking,nod_yes,celebrate">Think → Yes!</button>
      <button class="btn sequence" data-sequence="nervous,shy,wave_left">Shy Hello</button>
      <button class="btn sequence" data-sequence="surprised,excited,dance">OMG Dance!</button>
      <button class="btn sequence" data-sequence="smirk,eyeroll,sigh,dismiss">Sarcastic AF</button>
      <button class="btn sequence" data-sequence="pleading,sad,sigh">Guilt Trip</button>
    </div>

    <h2>Custom Motion</h2>
    <div id="custom-input">
      <input type="text" id="motion-text" placeholder="wave_left, 😊, side, straight..." />
      <button class="btn" id="btn-generate">Go</button>
    </div>

    <h2>Log</h2>
    <div id="log"></div>
  </div>

  <script type="module" src="./demo.js"></script>
</body>

</html>
