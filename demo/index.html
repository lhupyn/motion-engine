<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>motion-engine</title>
  <script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js/+esm",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "talkinghead": "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@1.7/modules/talkinghead.mjs"
  } }
  </script>
  <style>
    :root {
      --bg: #f6f6f4;
      --stage: #e9e8e4;
      --panel: #ffffff;
      --text: #1d1d1b;
      --muted: #6b6a66;
      --line: #dddcd7;
      --chip: #f1f0ec;
      --chip-hover: #e6e5e0;
      --accent: #2f6f5e;
      --accent-text: #ffffff;
      --ok: #2f6f5e;
      --skip: #8a8780;
      --error: #b3402e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141413;
        --stage: #1c1c1a;
        --panel: #1f1f1d;
        --text: #ecebe7;
        --muted: #9a9993;
        --line: #33332f;
        --chip: #2a2a27;
        --chip-hover: #34342f;
        --accent: #6fc2a8;
        --accent-text: #10201b;
        --ok: #6fc2a8;
        --skip: #8f8e88;
        --error: #e07a63;
      }
    }

    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      display: grid;
      grid-template-columns: minmax(0, 1fr) clamp(420px, 42vw, 640px);
      height: 100vh;
    }

    #stage { position: relative; background: var(--stage); min-height: 0; }
    #avatar { position: absolute; inset: 0; }
    #status {
      position: absolute; left: 16px; bottom: 16px;
      padding: 6px 10px; border-radius: 8px;
      background: var(--panel); color: var(--muted); font-size: 12px;
      border: 1px solid var(--line);
    }

    aside {
      background: var(--panel);
      border-left: 1px solid var(--line);
      overflow-y: auto;
      padding: 24px 24px 40px;
    }
    header h1 { font-size: 18px; letter-spacing: -0.01em; }
    header p { color: var(--muted); margin-top: 4px; }

    section { margin-top: 22px; }
    h2 {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--muted); margin-bottom: 8px;
    }
    h3 { font-size: 12px; font-weight: 500; color: var(--muted); margin: 10px 0 6px; }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    button {
      font: inherit; font-size: 13px;
      color: var(--text); background: var(--chip);
      border: 1px solid var(--line); border-radius: 999px;
      padding: 5px 11px; cursor: pointer;
    }
    button:hover { background: var(--chip-hover); }
    button.on { background: var(--accent); color: var(--accent-text); border-color: transparent; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    input[type=text], input[type=password] {
      font: inherit; width: 100%; min-width: 0;
      color: var(--text); background: var(--bg);
      border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px;
    }
    input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .row { display: flex; gap: 6px; align-items: center; }
    .row + .row, .row + .chips, .chips + .row { margin-top: 8px; }
    .note { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .note a { color: inherit; }
    #speaker { margin-top: 14px; }

    #log { list-style: none; padding: 0; margin-top: 12px; display: grid; gap: 8px; }
    #log li {
      border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px;
      font-size: 12px; background: var(--bg);
    }
    #log .line { font-size: 13px; color: var(--text); }
    #log .who { color: var(--muted); }
    #log .acts { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 4px; }
    #log .applied { color: var(--ok); }
    #log .skipped { color: var(--skip); }
    #log .error { color: var(--error); }
    #log .meta { color: var(--muted); margin-top: 4px; }

    @media (max-width: 760px) {
      body { grid-template-columns: 1fr; grid-template-rows: 55vh auto; height: auto; }
      aside { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="avatar"></div>
    <div id="status">Loading avatar…</div>
  </div>

  <aside>
    <header>
      <h1>motion-engine</h1>
      <p>Expressive face and body for TalkingHead avatars.</p>
    </header>

    <section>
      <h2>Talk to it</h2>
      <div class="row">
        <input id="key" type="password" placeholder="OpenRouter API key" autocomplete="off" />
        <button id="key-save">Use</button>
      </div>
      <p class="note" id="key-note">
        Jev decides the reactions. Your key stays in this browser and is sent only to openrouter.ai.
      </p>

      <div class="row chips" id="speaker" role="group" aria-label="Who says it">
        <button data-speaker="user" class="on">You say it</button>
        <button data-speaker="avatar">The avatar says it</button>
      </div>
      <form class="row" id="say">
        <input id="text" type="text" placeholder="I just got the job!" autocomplete="off" />
        <button type="submit">Send</button>
      </form>
      <div class="chips" id="phrases"></div>
      <ol id="log" reversed></ol>
    </section>

    <section>
      <h2>Camera</h2>
      <div class="chips" id="camera"></div>
    </section>

    <section>
      <h2>Face</h2>
      <h3>Expressions — held until replaced</h3>
      <div class="chips" id="moods"></div>
      <h3>Beats — play once</h3>
      <div class="chips" id="beats"></div>
    </section>

    <section>
      <h2>Body</h2>
      <div class="chips" id="gestures"></div>
    </section>
  </aside>

  <script type="module" src="./main.js"></script>
</body>
</html>
